# Reusable release for every Go bench in the family: goreleaser, keyless cosign
# signing, SLSA provenance. The caller owns the trigger and the permissions;
# this owns the steps, so a fix to the release process lands once.
#
#   jobs:
#     release:
#       uses: scm-bench/.github/.github/workflows/go-bench-release.yml@main
#       with:
#         bench: jenkins-bench
#         tag: ${{ inputs.tag }}   # empty on tag-push events
#
# The action SHAs below are pinned on purpose — update them deliberately, do
# not loosen them to tags.
name: Go bench release

on:
  workflow_call:
    inputs:
      bench:
        description: "Binary and cmd/ directory name, e.g. jenkins-bench"
        required: true
        type: string
      tag:
        description: "Tag to create and release (workflow_dispatch path only)"
        required: false
        type: string
        default: ""

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser builds the changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests before releasing
        run: go test ./... -count=1

      # Created after the tests, so a failing commit never gets tagged. Pushing
      # with GITHUB_TOKEN does not start another workflow run, so this does not
      # re-trigger the caller's push event.
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          # Passed through the environment rather than interpolated into the
          # script, so the input cannot inject shell.
          TAG: ${{ inputs.tag }}
          BENCH: ${{ inputs.bench }}
        run: |
          set -euo pipefail

          # Go ignores a tag that is not canonical semver, which makes the
          # release uninstallable while every build step still reports success.
          # Reject it here instead of finding out from a user.
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a canonical semver tag. Use vMAJOR.MINOR.PATCH, optionally with a prerelease suffix (v0.1.0, v0.1.0-rc.1)."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists; releases are immutable, pick a new version"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$BENCH $TAG"
          git push origin "$TAG"
          echo "created $TAG at $(git rev-parse --short HEAD)"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: anchore/sbom-action/download-syft@v0

      # goreleaser shells out to cosign for `signs` and `docker_signs`, so it
      # has to be on PATH before the release runs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance answers a different question than the signature does. The
      # cosign signature says this release came from this workflow; the
      # attestation records what it was built from — commit, workflow, runner —
      # in a form `gh attestation verify` checks without any of it having to be
      # taken on trust from the release notes.
      #
      # It runs after goreleaser because it attests the files goreleaser
      # produced. A failure here leaves a published release without provenance
      # rather than no release at all, which is the right way round: the
      # artifacts are already uploaded and their checksums already signed.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
