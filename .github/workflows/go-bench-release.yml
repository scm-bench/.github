# Reusable release: goreleaser + keyless cosign + SLSA provenance. The caller
# owns trigger and permissions. Action SHAs are pinned on purpose.
name: Go bench release

on:
  workflow_call:
    inputs:
      bench:
        description: "Binary and cmd/ directory name, e.g. jenkins-bench"
        required: true
        type: string
      tag:
        description: "Tag to create and release (workflow_dispatch path only)"
        required: false
        type: string
        default: ""

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # Credentials stay persisted: the "Create the tag" step pushes with them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          # goreleaser builds the changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      # A release that already exists for this tag is refused before anything is
      # built or tagged. goreleaser does not start a fresh one: it finds the existing
      # release and uploads into it. jenkins-bench v0.1.0-rc.2 was published by
      # hand from an earlier draft before its workflow ran, so the run appended
      # rc.2 archives beside that draft's 0.1.0 ones, then died uploading a
      # second checksums.txt. The published release kept the old checksum file,
      # which lists no rc.2 archive, so step 1 of its own "Verifying" section
      # fails for every file a user would download.
      - name: Refuse a tag that already has a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Only "release not found" lets the run go on. Any other failure to
          # ask — an outage, a token without access — is not an answer.
          if out=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft 2>&1); then
            echo "::error::a release for $TAG already exists ($out); releases are immutable, so delete it or pick a new version"
            exit 1
          elif [ "$out" != "release not found" ]; then
            echo "::error::could not check whether $TAG already has a release: $out"
            exit 1
          fi
          echo "no release for $TAG yet"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache in the job that signs. setup-go would restore the module
          # and build caches that CI runs on main saved, and those runs execute
          # third-party actions; anything they left in GOCACHE would be linked
          # into a binary this job then signs and attests. A clean download is
          # checked against go.sum; a restored cache is not.
          cache: false

      - name: Run tests before releasing
        run: go test ./... -count=1

      # After the tests, so a failing commit never gets tagged. GITHUB_TOKEN
      # pushes do not re-trigger workflows.
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          # Via env, so the input cannot inject shell.
          TAG: ${{ inputs.tag }}
          BENCH: ${{ inputs.bench }}
        run: |
          set -euo pipefail

          # Non-canonical semver makes the release uninstallable while every
          # step reports success.
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a canonical semver tag. Use vMAJOR.MINOR.PATCH, optionally with a prerelease suffix (v0.1.0, v0.1.0-rc.1)."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists; releases are immutable, pick a new version"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$BENCH $TAG"
          git push origin "$TAG"
          echo "created $TAG at $(git rev-parse --short HEAD)"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # goreleaser shells out to cosign, so it must be on PATH.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The signature says which workflow built it; the attestation records
      # what from. After goreleaser: a failure here leaves a release without
      # provenance, not no release.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
