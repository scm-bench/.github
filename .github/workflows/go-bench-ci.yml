# Reusable CI for every Go bench in the family.
#
# One definition, called from each repository with the bench's name:
#
#   jobs:
#     ci:
#       uses: scm-bench/.github/.github/workflows/go-bench-ci.yml@main
#       with:
#         bench: jenkins-bench
#
# It lives here rather than being copied per repository because CI is the one
# place the benches must not drift apart: the coverage floors, the read-only
# image check and the tidy check are family rules, and a rule enforced by N
# diverging copies stops being a rule. A bench with a genuinely different need
# overrides an input; it does not fork the pipeline.
name: Go bench CI

on:
  workflow_call:
    inputs:
      bench:
        description: "Binary and cmd/ directory name, e.g. jenkins-bench"
        required: true
        type: string
      go-coverage-floor:
        description: "Minimum total Go coverage percent"
        required: false
        type: string
        default: "85"
      rego-coverage-floor:
        description: "Minimum Rego coverage percent"
        required: false
        type: string
        default: "100"
      policy-path:
        description: "Path to the Rego policy bundle"
        required: false
        type: string
        default: "internal/checks/policies"

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The release builds darwin and windows archives, and the code that
        # decides them apart — terminal detection, signal handling, path
        # handling — is exactly the code a linux-only job never exercises.
        # Linting and coverage run once, on linux; the others just run the
        # tests.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: make fmt-check

      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: make vet

      # go.mod and go.sum are what the release builds from, and .goreleaser.yaml
      # runs `go mod tidy` during a release — so a repository whose modules are
      # untidy produces a release built from a dependency set nobody tested.
      - name: Check go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"
            exit 1
          }

      # -coverpkg is the point: without it Go measures each package only from
      # its own tests, so a package exercised mostly by the CLI tests reads as
      # barely covered. The number was measuring the wrong thing.
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... -race -count=1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./... -count=1

      - name: Report coverage
        if: matrix.os == 'ubuntu-latest'
        env:
          FLOOR: ${{ inputs.go-coverage-floor }}
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          # A floor, not a target. It is here to catch a change that drops whole
          # files out of the tested set.
          awk -v t="$total" -v floor="$FLOOR" 'BEGIN {
            printf "total coverage: %s%% (floor %s%%)\n", t, floor
            if (t + 0 < floor + 0) { printf "::error::coverage %s%% is below the %s%% floor\n", t, floor; exit 1 }
          }'

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  policy:
    name: Policy bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      # The Go tests compile the bundle, but opa check also catches unused
      # imports and style problems the compiler tolerates.
      - name: Check Rego
        run: opa check --strict ${{ inputs.policy-path }}

      - name: Check Rego formatting
        run: opa fmt --list --fail ${{ inputs.policy-path }}

      # Rego is where every verdict is actually decided, and `go test -cover`
      # cannot see any of it.
      - name: Run the policy unit tests
        run: opa test ${{ inputs.policy-path }} -v

      - name: Check policy coverage
        env:
          FLOOR: ${{ inputs.rego-coverage-floor }}
        run: |
          set -euo pipefail
          opa test ${{ inputs.policy-path }} --coverage --format=json > policy-coverage.json
          # Held at 100 by default. The bundle is small, every branch of it is a
          # verdict somebody will act on, and an uncovered branch is a verdict
          # nobody has ever seen the rule produce.
          jq -r '.coverage' policy-coverage.json | awk -v floor="$FLOOR" '{
            printf "policy coverage: %s%% (floor %s%%)\n", $1, floor
            if ($1 + 0 < floor + 0) { printf "::error::policy coverage %s%% is below %s%%\n", $1, floor; exit 1 }
          }'

      - name: Verify the bundle loads
        run: go run ./cmd/${{ inputs.bench }} list-checks

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A tool that audits other people's supply chains should know about its
      # own. govulncheck reports only what this code actually reaches, so a
      # finding here is a call path, not a dependency-tree coincidence.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A snapshot build exercises the full release matrix on every push, so a
      # broken goreleaser config is found before a tag depends on it.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # `goreleaser build` does not build images, so nothing checked the
      # Dockerfiles until a tag was pushed — and a release cannot be
      # unpublished. Both are built here: Dockerfile from source, and the
      # release image against a stand-in binary, since its whole job is to
      # copy one in from the build context.
      - name: Build the source image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ inputs.bench }}:ci

      - name: Check the image runs and is read-only about it
        run: |
          set -euo pipefail
          docker run --rm ${{ inputs.bench }}:ci version
          docker run --rm ${{ inputs.bench }}:ci list-checks | tail -1
          # The image must not run as root: it is handed a credential that can
          # read everything the bench audits.
          user=$(docker run --rm --entrypoint id ${{ inputs.bench }}:ci -u)
          if [ "$user" = "0" ]; then
            echo "::error::the image runs as root"
            exit 1
          fi

      - name: Build the release image
        run: |
          set -euo pipefail
          # Dockerfile.goreleaser expects a prebuilt binary beside it, which is
          # what goreleaser puts there. Standing one in checks the COPY path
          # and the entrypoint without running a release.
          CGO_ENABLED=0 go build -trimpath -o ${{ inputs.bench }} ./cmd/${{ inputs.bench }}
          docker build -f Dockerfile.goreleaser -t ${{ inputs.bench }}:ci-release .
          docker run --rm ${{ inputs.bench }}:ci-release version
