# Reusable CI for every Go bench. Called with the bench's name; defined once so
# the family's rules (coverage floors, non-root image, tidy check) cannot drift
# between repositories. A bench overrides an input, never forks the pipeline.
name: Go bench CI

on:
  workflow_call:
    inputs:
      bench:
        description: "Binary and cmd/ directory name, e.g. jenkins-bench"
        required: true
        type: string
      go-coverage-floor:
        description: "Minimum total Go coverage percent"
        required: false
        type: string
        default: "85"
      rego-coverage-floor:
        description: "Minimum Rego coverage percent"
        required: false
        type: string
        default: "100"
      policy-path:
        description: "Path to the Rego policy bundle"
        required: false
        type: string
        default: "internal/checks/policies"

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Release ships darwin/windows archives; only a matrix exercises the
        # code that tells the platforms apart. Lint and coverage run once.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: make fmt-check

      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: make vet

      # Untidy modules mean a release built from a dependency set nobody tested.
      - name: Check go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"
            exit 1
          }

      # -coverpkg: without it a package exercised by another package's tests
      # reads as uncovered.
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... -race -count=1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./... -count=1

      - name: Report coverage
        if: matrix.os == 'ubuntu-latest'
        env:
          FLOOR: ${{ inputs.go-coverage-floor }}
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          # A floor, not a target: catches files dropping out of the tested set.
          awk -v t="$total" -v floor="$FLOOR" 'BEGIN {
            printf "total coverage: %s%% (floor %s%%)\n", t, floor
            if (t + 0 < floor + 0) { printf "::error::coverage %s%% is below the %s%% floor\n", t, floor; exit 1 }
          }'

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  policy:
    name: Policy bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      # The Go tests compile the bundle, but opa check also catches unused
      # imports and style problems the compiler tolerates.
      - name: Check Rego
        run: opa check --strict ${{ inputs.policy-path }}

      - name: Check Rego formatting
        run: opa fmt --list --fail ${{ inputs.policy-path }}

      # Every verdict is decided in Rego, which go test -cover cannot see.
      - name: Run the policy unit tests
        run: opa test ${{ inputs.policy-path }} -v

      - name: Check policy coverage
        env:
          FLOOR: ${{ inputs.rego-coverage-floor }}
        run: |
          set -euo pipefail
          opa test ${{ inputs.policy-path }} --coverage --format=json > policy-coverage.json
          # 100 by default: an uncovered branch is a verdict nobody has seen.
          jq -r '.coverage' policy-coverage.json | awk -v floor="$FLOOR" '{
            printf "policy coverage: %s%% (floor %s%%)\n", $1, floor
            if ($1 + 0 < floor + 0) { printf "::error::policy coverage %s%% is below %s%%\n", $1, floor; exit 1 }
          }'

      - name: Verify the bundle loads
        run: go run ./cmd/${{ inputs.bench }} list-checks

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck reports only reachable vulnerabilities: a finding is a call
      # path, not a dependency-tree coincidence.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Finds a broken goreleaser config before a tag depends on it.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # goreleaser build skips images, and a release cannot be unpublished —
      # so both Dockerfiles are checked here.
      - name: Build the source image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ inputs.bench }}:ci

      - name: Check the image runs and is read-only about it
        run: |
          set -euo pipefail
          docker run --rm ${{ inputs.bench }}:ci version
          docker run --rm ${{ inputs.bench }}:ci list-checks | tail -1
          # Not as root: the image is handed a credential.
          user=$(docker run --rm --entrypoint id ${{ inputs.bench }}:ci -u)
          if [ "$user" = "0" ]; then
            echo "::error::the image runs as root"
            exit 1
          fi

      - name: Build the release image
        run: |
          set -euo pipefail
          # Dockerfile.goreleaser expects a prebuilt binary; stand one in.
          CGO_ENABLED=0 go build -trimpath -o ${{ inputs.bench }} ./cmd/${{ inputs.bench }}
          docker build -f Dockerfile.goreleaser -t ${{ inputs.bench }}:ci-release .
          docker run --rm ${{ inputs.bench }}:ci-release version
