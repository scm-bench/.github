# Reusable label sync. The label set lives once, in this repo's labels.json —
# release notes group by these labels, so they must not drift between repos.
name: Go bench labels

on:
  workflow_call: {}

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      # The central set, not the caller's tree: no per-repo copy to drift.
      - uses: actions/checkout@v7
        with:
          repository: scm-bench/.github
          ref: main

      - name: Apply the family labels.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # jq ships on the runner; nothing to install first.
          jq -e 'type == "array" and length > 0' labels.json > /dev/null

          jq -r '.[] | [.name, .color, .description] | @tsv' labels.json |
            while IFS=$'\t' read -r name color description; do
              # --force also updates GitHub's default labels.
              gh label create "$name" \
                --color "$color" \
                --description "$description" \
                --force
              echo "  $name"
            done

      - name: Report labels not in the file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Reports rather than deletes: removal strips the label from issues.
          comm -23 \
            <(gh label list --limit 200 --json name --jq '.[].name' | sort) \
            <(jq -r '.[].name' labels.json | sort) \
            | sed 's/^/  not in labels.json: /'
