<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="scm-bench">
  <title>scm-bench</title>
  <!--
    Organization avatar. The identity is paper-first, so the tile is white with
    the mark in the brand green — it sits quietly on GitHub's light theme and
    reads as a deliberate light tile on dark, the way light-identity projects
    normally do. Full bleed on purpose: GitHub rounds avatars itself, and
    supplying rounded corners would round them twice.

    The nodes are solid and only slightly wider than the stroke. Ring nodes
    were tried and failed the size that matters most — at the 20px GitHub uses
    in a timeline the holes closed up. Solid nodes collapse gracefully: a clean
    check when tiny, three distinct commit nodes once there is room.
  -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#D8DEE4"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="#FFFFFF"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <!-- One amber node in the field. The project's defining behaviour is
       admitting what it could not determine, and the identity says so quietly
       rather than claiming everything is green. -->
  <circle cx="432" cy="80" r="2.2" fill="#BF8700"/>

  <g transform="translate(38.4 38.4) scale(6.8)">
    <path d="M14 33 L27 46 L50 18" fill="none" stroke="#1F883D"
          stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#1F883D">
      <circle cx="14" cy="33" r="7.5"/>
      <circle cx="27" cy="46" r="7.5"/>
      <circle cx="50" cy="18" r="7.5"/>
    </g>
  </g>
</svg>
