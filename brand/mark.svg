<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="scm-bench">
  <title>scm-bench</title>
  <!--
    Three commit nodes joined by two strokes. Read quickly it is a check mark;
    read slowly it is a commit graph — which is what the tool verifies.
    Pure geometry, no text and no font dependency, so this file renders
    identically anywhere it is embedded. The green sits between GitHub's light
    and dark success greens so it holds on either theme.
  -->
  <g fill="none" stroke="#2DA44E" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 33 L27 46 L50 18"/>
  </g>
  <g fill="#2DA44E">
    <circle cx="14" cy="33" r="7.5"/>
    <circle cx="27" cy="46" r="7.5"/>
    <circle cx="50" cy="18" r="7.5"/>
  </g>
</svg>
